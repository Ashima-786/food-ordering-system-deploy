name: Auto-Teardown (10-Day Safety Limit)

on:
  schedule:
    # Runs daily at 04:00 UTC to check if 10 days have elapsed
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_destroy:
        description: 'Set to true to force destroy AWS resources immediately'
        required: true
        type: boolean
        default: false

jobs:
  check-and-destroy:
    name: Check 10-Day Expiry & Destroy
    runs-on: ubuntu-latest
    if: github.repository_owner == 'VenuGopalops'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

      - name: Setup Terraform
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: hashicorp/setup-terraform@v3

      - name: Evaluate 10-Day Limit
        id: evaluate
        run: |
          # Calculate days since latest commit
          LAST_COMMIT_DATE=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DIFF_DAYS=$(( (NOW - LAST_COMMIT_DATE) / 86400 ))
          echo "Days elapsed since last deployment commit: $DIFF_DAYS days"

          if [ "$DIFF_DAYS" -ge 10 ] || [ "${{ github.event.inputs.force_destroy }}" = "true" ]; then
            echo "TRIGGER_DESTROY=true" >> $GITHUB_OUTPUT
            echo "⚠️ 10-day limit reached or manual destroy triggered!"
          else
            echo "TRIGGER_DESTROY=false" >> $GITHUB_OUTPUT
            echo "✅ Project is still within the 10-day allowed window ($DIFF_DAYS/10 days)."
          fi

      - name: Execute Terraform Destroy
        if: steps.evaluate.outputs.TRIGGER_DESTROY == 'true' && env.AWS_ACCESS_KEY_ID != ''
        working-directory: ./terraform
        run: |
          echo "Running terraform destroy to terminate all AWS resources..."
          terraform init
          terraform destroy -auto-approve
          echo "✅ All AWS resources have been successfully destroyed."
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

