# ─────────────────────────────────────────────────────────────────────────────
#  Zestora – Production Docker Compose for AWS EC2
#  Services:
#    • frontend: Nginx reverse proxy & React SPA (Port 80/443 exposed)
#    • backend:  Flask API with Gunicorn (Internal network only, not exposed)
#    • mongo:    MongoDB 7.0 database (Internal network only with EBS persistence)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: zestora_mongo_prod
    restart: always
    environment:
      MONGO_INITDB_DATABASE: zestora
    volumes:
      - mongo_data:/data/db
      - ./database/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - zestora_net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Flask Backend ─────────────────────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-zestora-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zestora_backend_prod
    restart: always
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/zestora}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in production}
      FLASK_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    # Notice: Port 5000 is intentionally NOT mapped to host for security.
    # Frontend Nginx proxies /api/ traffic directly across zestora_net.
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - zestora_net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── React Frontend / Nginx Edge Proxy ─────────────────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE:-zestora-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zestora_frontend_prod
    restart: always
    ports:
      - "${HTTP_PORT:-80}:3000"
      # Uncomment if running SSL directly on host:
      # - "${HTTPS_PORT:-443}:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - zestora_net
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/healthz" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  zestora_net:
    driver: bridge

